<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root,:root[data-theme="biru"]{--bg:#def1ff;--card:#fff;--ink:#0f2f4a;--mute:#46627a;--pri:#1a75bd;--onpri:#fff;--coin:#ffb400;--ok:#12805a;--line:#b5dcf5;--soft:#cbe8fb;--err:#c62828;--lnk:#1a6bb0}
:root[data-theme="hijau"]{--bg:#eaf7ee;--card:#fff;--ink:#10301e;--mute:#47604f;--pri:#1a7f43;--onpri:#fff;--coin:#f2b300;--ok:#0f6e3b;--line:#bfe0c9;--soft:#d9f0e0;--err:#c62828;--lnk:#146b37}
:root[data-theme="kuning"]{--bg:#fff7d6;--card:#fffef6;--ink:#33280a;--mute:#6b5a1f;--pri:#f5b800;--onpri:#2e2200;--coin:#e07b00;--ok:#12805a;--line:#ecd98a;--soft:#fbeeb0;--err:#c62828;--lnk:#8a5a00}
:root[data-theme="pink"]{--bg:#ffeef4;--card:#fff;--ink:#4a1230;--mute:#7a4a63;--pri:#c2185b;--onpri:#fff;--coin:#f2a900;--ok:#12805a;--line:#f5c2d6;--soft:#fbd9e6;--err:#b71c1c;--lnk:#ad1457}
:root[data-theme="putih"]{--bg:#fff;--card:#fff;--ink:#18181b;--mute:#52525b;--pri:#27272a;--onpri:#fff;--coin:#f59e0b;--ok:#15803d;--line:#d4d4d8;--soft:#f1f1f3;--err:#c62828;--lnk:#1d4ed8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Nunito,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2.1rem,7vw,3.6rem);font-weight:800}h2{font-size:1.8rem;font-weight:800}h3{font-size:1.15rem;font-weight:600}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:8px 12px}
nav{display:flex;gap:6px;overflow-x:auto;flex:1 1 240px;min-width:0}nav[hidden]{display:none}
main a:not(.btn){color:var(--lnk)}
nav a{white-space:nowrap;text-decoration:none;color:var(--ink);padding:6px 12px;border-radius:99px;font-weight:600}
nav a.on{background:var(--pri);color:var(--onpri)}nav a.done::after{content:" ✓";color:var(--ok)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
main{max-width:960px;margin:0 auto;padding:24px 16px 64px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.btn{font:800 1rem "Baloo 2",sans-serif;background:var(--pri);color:var(--onpri);border:0;border-radius:12px;padding:9px 18px;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}.btn.alt{background:var(--soft);color:var(--ink)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);font-size:.85rem;font-weight:800}
.mute{color:var(--mute)}.bar{height:14px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--coin);transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;font:600 .95rem Nunito,sans-serif;cursor:pointer}.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
input[type=search],input[type=text],textarea{width:100%;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
textarea{font:.85rem/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:260px}
.game{cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px}.game:hover{border-color:var(--pri)}.game.mine{border-color:var(--coin);border-width:3px}
dialog{border:3px solid var(--pri);border-radius:18px;background:var(--card);color:var(--ink);max-width:560px;width:calc(100% - 24px);padding:22px}
dialog::backdrop{background:rgba(10,8,30,.65)}
details{border:2px solid var(--line);border-radius:14px;background:var(--card);margin:10px 0;padding:4px 16px}
summary{cursor:pointer;font:600 1.1rem "Baloo 2",sans-serif;padding:8px 0}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}label.ck input{width:20px;height:20px;margin-top:3px;accent-color:var(--pri);flex:none}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:460px}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:var(--soft)}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.88em}
.step{display:grid;grid-template-columns:44px 1fr;gap:12px;margin:14px 0}.step .n{width:44px;height:44px;border-radius:50%;background:var(--coin);color:#1d1a3b;display:grid;place-items:center;font:800 1.2rem "Baloo 2",sans-serif}
.nextrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
pre{overflow-x:auto;background:var(--soft);padding:12px;border-radius:10px;font-size:.8rem;line-height:1.5}dialog{max-height:90vh;overflow-y:auto}#mine{scroll-margin-top:70px}
.palet{display:flex;align-items:center;gap:7px;flex:none}.palet[hidden]{display:none}.palet .lbl{font-weight:800;font-size:.85rem}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer;background:var(--c);position:relative;display:block;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.sw.rb{background:conic-gradient(#f44,#fc0,#4d4,#0cf,#44f,#f4f,#f44)}.sw.rb:focus-within{outline:3px solid var(--coin);outline-offset:2px}
.sw.rb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.gframe{display:block;margin:12px auto;width:100%;max-width:480px;aspect-ratio:480/740;border:0;border-radius:18px;background:#d9f3fa}
.kodebox{position:relative;display:block;margin:10px 0;max-height:62vh;overflow:auto;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 0;font:.78rem/1.55 ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.ln{display:block;white-space:pre;width:max-content;min-width:100%;padding-right:12px}
.ln i{display:inline-block;width:3.4em;text-align:right;padding-right:.9em;color:var(--mute);user-select:none;font-style:normal}
.ln:not(.nb){background:hsl(var(--h) 85% 88% / .65);box-shadow:inset 4px 0 0 hsl(var(--h) 65% 45%)}
.ln.on{background:hsl(var(--h) 90% 78%)}
.kodebox.fokus .ln:not(.on){opacity:.3}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.ln[data-g="0"]{--h:210}
.ln[data-g="1"]{--h:150}
.ln[data-g="2"]{--h:30}
.ln[data-g="3"]{--h:280}
.ln[data-g="4"]{--h:0}
.ln[data-g="5"]{--h:45}
.ln[data-g="6"]{--h:330}
.ln[data-g="7"]{--h:180}
.ln[data-g="8"]{--h:100}
.ln[data-g="9"]{--h:240}
.cover{text-align:center;padding:12px 0 8px}.cover img{width:min(200px,50vw);height:auto;border-radius:24px;border:3px solid var(--line);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.cover .sk{font:800 1.15rem "Baloo 2",sans-serif;letter-spacing:.04em;margin:14px 0 0}.cover .ujian{display:inline-block;margin:14px 0 4px;background:var(--pri);color:var(--onpri);padding:4px 16px;border-radius:99px;font:800 1rem "Baloo 2",sans-serif}
.cover h1{margin:.1em 0 .2em}.cover .gr{margin:20px auto 0;max-width:420px}
.game.ex{cursor:not-allowed;opacity:.9;border-style:dashed}.game.ex:hover{border-color:var(--line)}
.kedip{color:var(--err);font-weight:800;animation:kdp 1s steps(2,start) infinite}
@keyframes kdp{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.kedip{animation:none}}</style>
</head>
<body>
<header id="top"><div class="palet" role="group" aria-label="Pilih tema warna"><span class="lbl">Tema</span><button type="button" class="sw" data-sw="biru" style="--c:#5ec2f5" title="Biru muda" aria-label="Tema Biru muda" aria-pressed="false"></button><button type="button" class="sw" data-sw="hijau" style="--c:#4cc27a" title="Hijau" aria-label="Tema Hijau" aria-pressed="false"></button><button type="button" class="sw" data-sw="kuning" style="--c:#f5c518" title="Kuning" aria-label="Tema Kuning" aria-pressed="false"></button><button type="button" class="sw" data-sw="pink" style="--c:#f48fb1" title="Merah muda" aria-label="Tema Merah muda" aria-pressed="false"></button><button type="button" class="sw" data-sw="putih" style="--c:#ffffff" title="Putih" aria-label="Tema Putih" aria-pressed="false"></button><label class="sw rb" title="Warna sendiri"><input type="color" id="warna" value="#1a75bd" aria-label="Pilih warna sendiri"></label></div><nav id="nav"></nav></header>
<main id="app"></main>
<dialog id="dlg"></dialog>

x 0 #17475b; transition: transform .12s, box-shadow .12s;\n    }\n    .tombol:hover { background: #ffb15e; }\n    .tombol:active { transform: translateY(4px); box-shadow: 0 1px 0 #17475b; }\n    .tombol.sekunder { background: #fff; }\n    button:focus-visible, canvas:focus-visible { outline: 4px solid #f16a36; outline-offset: 3px; }\n    .petunjuk { display: grid; gap: 10px; text-align: left; max-width: 320px; }\n    .petunjuk p { padding: 10px 13px; background: #ffffffc9; border-radius: 12px; font-size: 15px; }\n    .hud { position: absolute; inset: 0 0 auto; z-index: 2; pointer-events: none; height: 68px; }\n    .skor {\n      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);\n      padding: 4px 16px; border-radius: 12px; background: #ffffffdd;\n      font-size: 28px; font-weight: 900; color: #164961;\n    }\n    .nyawa { position: absolute; top: 21px; right: 14px; font-size: 23px; letter-spacing: 1px; white-space: nowrap; }\n    .pesan {\n      position: absolute; z-index: 2; top: 25%; left: 50%;\n      transform: translateX(-50%); width: max-content; max-width: 90%;\n      padding: 10px 16px; border: 3px solid #17475b; border-radius: 13px;\n      background: #fff; font-size: 18px; font-weight: 900; text-align: center;\n      pointer-events: none;\n    }\n    .bantuan { position: absolute; bottom: 15px; left: 0; right: 0; z-index: 2; text-align: center; color: #17475b; font-size: 13px; font-weight: 800; pointer-events: none; }\n    @media (max-height: 700px) {\n      .bingkai { width: min(100%, 400px, calc((100vh - 32px) * 2 / 3)); }\n      .layar { gap: 10px; padding: 18px; }\n      .ilustrasi { font-size: 48px; }\n      .petunjuk { gap: 6px; }\n      .petunjuk p { padding: 7px 10px; }\n    }\n  <\/style>\n <\/head>\n <body>\n  <main class=\"bingkai canva-panel\" aria-label=\"Game Drone Lolos Gedung\">\n   <canvas id=\"kanvas-permainan\" width=\"400\" height=\"600\" tabindex=\"0\" aria-label=\"Area permainan. Ketuk, klik, atau tekan Spasi untuk menaikkan drone.\"><\/canvas>\n   <section id=\"layar-menu\" class=\"layar canva-section\" aria-labelledby=\"judul-game\"><span class=\"lencana canva-tag\">Misi kota pintar<\/span>\n    <div class=\"ilustrasi\" aria-hidden=\"true\">\n     🚁\n    <\/div>\n    <h1 id=\"judul-game\" class=\"canva-text\">Drone Lolos Gedung<\/h1>\n    <p class=\"canva-text\">Kota pintar diserang virus! Terbangkan drone pengantar penawar melewati celah gedung.<\/p><button id=\"tombol-mulai\" class=\"tombol canva-button\" type=\"button\">Mulai Misi<\/button> <button id=\"tombol-cara\" class=\"tombol sekunder canva-button\" type=\"button\">Cara Bermain<\/button>\n   <\/section>\n   <section id=\"layar-cara\" class=\"layar canva-section\" aria-labelledby=\"judul-cara\" hidden><span class=\"lencana canva-tag\">Panduan pilot<\/span>\n    <h2 id=\"judul-cara\" class=\"canva-text\">Cara Bermain<\/h2>\n    <div class=\"petunjuk\">\n     <p class=\"canva-text\">👆 Ketuk layar, klik area permainan, atau tekan <strong>Spasi<\/strong> agar drone naik.<\/p>\n     <p class=\"canva-text\">🏙️ Lewati celah gedung untuk mendapat 1 poin. Gedung makin cepat setiap 5 poin.<\/p>\n     <p class=\"canva-text\">❤️ Kamu punya 3 nyawa. Hindari gedung dan tanah!<\/p>\n     <p class=\"canva-text\">🏆 Raih 15 poin untuk mengantar penawar dan menyelamatkan kota.<\/p>\n    <\/div><button id=\"tombol-kembali\" class=\"tombol canva-button\" type=\"button\">Kembali ke Menu<\/button>\n   <\/section>\n   <div id=\"hud\" class=\"hud\" hidden>\n    <div id=\"tampilan-skor\" class=\"skor canva-text\" aria-label=\"Skor 0\">\n     0\n    <\/div>\n    <div id=\"tampilan-nyawa\" class=\"nyawa canva-text\" aria-label=\"3 nyawa tersisa\">\n     ❤️❤️❤️\n    <\/div>\n   <\/div>\n   <div id=\"pesan-game\" class=\"pesan canva-banner\" role=\"status\" aria-live=\"polite\" hidden><\/div>\n   <div id=\"bantuan-main\" class=\"bantuan canva-text\" hidden>\n    Ketuk • Klik • Spasi untuk naik\n   <\/div>\n   <section id=\"layar-menang\" class=\"layar canva-section\" aria-labelledby=\"judul-menang\" hidden><span class=\"lencana canva-tag\">Misi berhasil<\/span>\n    <div class=\"ilustrasi\" aria-hidden=\"true\">\n     🏆\n    <\/div>\n    <h2 id=\"judul-menang\" class=\"canva-text\">Kota Terselamatkan!<\/h2>\n    <p id=\"skor-menang\" class=\"canva-text\">Skor: 15<\/p>\n    <p class=\"canva-text\">Penawar virus berhasil diantarkan. Kerja hebat, pilot!<\/p><button id=\"tombol-main-lagi\" class=\"tombol canva-button\" type=\"button\">Main Lagi<\/button>\n   <\/section>\n   <section id=\"layar-kalah\" class=\"layar canva-section\" aria-labelledby=\"judul-kalah\" hidden><span class=\"lencana canva-tag\">Misi terhenti<\/span>\n    <div class=\"ilustrasi\" aria-hidden=\"true\">\n     💔\n    <\/div>\n    <h2 id=\"judul-kalah\" class=\"canva-text\">Game Over<\/h2>\n    <p id=\"skor-kalah\" class=\"canva-text\">Skor: 0<\/p>\n    <p class=\"canva-text\">Jangan menyerah! Kota masih membutuhkanmu.<\/p><button id=\"tombol-coba-lagi\" class=\"tombol canva-button\" type=\"button\">Coba Lagi<\/button>\n   <\/section>\n  <\/main>\n  <script>\n    // ===== BAGIAN 1: PENGATURAN (angka yang mudah diubah) =====\n    const LEBAR_KANVAS = 400;\n    const TINGGI_KANVAS = 600;\n    const TINGGI_TANAH = 42;\n    const JUMLAH_NYAWA = 3;\n    const GRAVITASI = 0.38;\n    const KEKUATAN_LONCAT = -6.8;\n    const KECEPATAN_GEDUNG = 2.1;\n    const TAMBAHAN_KECEPATAN = 0.25;\n    const LEBAR_CELAH = 168;\n    const LEBAR_GEDUNG = 68;\n    const JARAK_GEDUNG = 225;\n    const SKOR_MENANG = 15;\n    const JEDA_KEBAL = 1000;\n    const JARI_JARI_DRONE = 18;\n    const POSISI_DRONE_X = 105;\n    const kanvas = document.getElementById(\"kanvas-permainan\");\n    const pena = kanvas.getContext(\"2d\");\n    let layarAktif = \"menu\";\n    let drone, gedung, skor, nyawa, kecepatanGedung, waktuKebal, waktuPesan;\n    let nomorAnimasi = null;\n    let waktuFrameTerakhir = 0;\n    let waktuPermainan = 0;\n\n    // ===== BAGIAN 2: TAMPILAN AWAL (menu dan cara bermain) =====\n    const layar = {\n      menu: document.getElementById(\"layar-menu\"),\n      cara: document.getElementById(\"layar-cara\"),\n      menang: document.getElementById(\"layar-menang\"),\n      kalah: document.getElementById(\"layar-kalah\")\n    };\n    const hud = document.getElementById(\"hud\");\n    const bantuanMain = document.getElementById(\"bantuan-main\");\n    const pesanGame = document.getElementById(\"pesan-game\");\n\n    // Menampilkan layar yang dipilih dan menyembunyikan layar lainnya.\n    function tampilkanLayar(nama) {\n      layarAktif = nama;\n      Object.entries(layar).forEach(([kunci, elemen]) => { elemen.hidden = kunci !== nama; });\n      hud.hidden = nama !== \"main\";\n      bantuanMain.hidden = nama !== \"main\";\n      if (nama !== \"main\") pesanGame.hidden = true;\n    }\n\n    // Menggambar latar kota kartun untuk setiap layar.\n    function gambarLatar() {\n      pena.fillStyle = \"#aee8f7\";\n      pena.fillRect(0, 0, LEBAR_KANVAS, TINGGI_KANVAS);\n      pena.fillStyle = \"#ffffffa8\";\n      for (const [x, y] of [[65, 98], [290, 168], [175, 290]]) {\n        pena.beginPath();\n        pena.ellipse(x, y, 37, 13, 0, 0, Math.PI * 2);\n        pena.ellipse(x - 14, y - 8, 20, 15, 0, 0, Math.PI * 2);\n        pena.fill();\n      }\n      pena.fillStyle = \"#8cc9d6\";\n      for (let x = 0; x < LEBAR_KANVAS; x += 66) {\n        const tinggi = 67 + (x * 7 % 38);\n        pena.fillRect(x, TINGGI_KANVAS - TINGGI_TANAH - tinggi, 52, tinggi);\n      }\n      pena.fillStyle = \"#72b884\";\n      pena.fillRect(0, TINGGI_KANVAS - TINGGI_TANAH, LEBAR_KANVAS, 7);\n      pena.fillStyle = \"#658b7d\";\n      pena.fillRect(0, TINGGI_KANVAS - TINGGI_TANAH + 7, LEBAR_KANVAS, TINGGI_TANAH);\n    }\n\n    // ===== BAGIAN 3: KARAKTER (drone) =====\n    // Mengembalikan drone ke tengah dengan kecepatan awal nol.\n    function aturUlangDrone() {\n      drone = { x: POSISI_DRONE_X, y: TINGGI_KANVAS / 2, kecepatanY: 0, kilau: 0 };\n    }\n\n    // Menggambar drone oranye dari bentuk sederhana.\n    function gambarDrone() {\n      if (!drone) return;\n      const berkedip = layarAktif === \"main\" && performance.now() < waktuKebal;\n      if (berkedip && Math.floor(performance.now() / 110) % 2 === 0) pena.globalAlpha = 0.42;\n      pena.save();\n      pena.translate(drone.x, drone.y);\n      pena.fillStyle = drone.kilau > 0 ? \"#ffe46a\" : \"#f78234\";\n      pena.strokeStyle = \"#77462e\";\n      pena.lineWidth = 3;\n      pena.beginPath();\n      pena.roundRect(-18, -12, 36, 25, 9);\n      pena.fill();\n      pena.stroke();\n      pena.fillStyle = \"#d8faff\";\n      pena.beginPath();\n      pena.roundRect(2, -8, 12, 10, 4);\n      pena.fill();\n      pena.strokeStyle = \"#77462e\";\n      pena.beginPath();\n      pena.moveTo(-14, -8); pena.lineTo(-25, -19);\n      pena.moveTo(14, -8); pena.lineTo(25, -19);\n      pena.moveTo(-12, 12); pena.lineTo(-12, 18);\n      pena.moveTo(12, 12); pena.lineTo(12, 18);\n      pena.stroke();\n      pena.fillStyle = \"#24465b\";\n      pena.fillRect(-32, -21, 16, 3);\n      pena.fillRect(16, -21, 16, 3);\n      if (drone.kilau > 0) {\n        pena.strokeStyle = \"#fff9b5\";\n        pena.lineWidth = 3;\n        pena.beginPath();\n        pena.arc(0, 0, 27, 0, Math.PI * 2);\n        pena.stroke();\n      }\n      pena.restore();\n      pena.globalAlpha = 1;\n    }\n\n    // ===== BAGIAN 4: RINTANGAN (gedung dan celah) =====\n    // Membuat sepasang gedung dengan celah pada ketinggian acak.\n    function buatGedung(x) {\n      const batasAtas = 105;\n      const batasBawah = TINGGI_KANVAS - TINGGI_TANAH - LEBAR_CELAH - 105;\n      return { x, batasCelah: batasAtas + Math.random() * (batasBawah - batasAtas), sudahDilewati: false };\n    }\n\n    // Menggambar badan gedung dan jendela kuning.\n    function gambarSatuGedung(x, y, lebar, tinggi) {\n      pena.fillStyle = \"#718695\";\n      pena.fillRect(x, y, lebar, tinggi);\n      pena.fillStyle = \"#4d6879\";\n      pena.fillRect(x - 4, y, lebar + 8, 8);\n      pena.fillRect(x - 4, y + tinggi - 8, lebar + 8, 8);\n      pena.fillStyle = \"#ffe08a\";\n      for (let baris = y + 21; baris < y + tinggi - 16; baris += 32) {\n        for (let kolom = x + 11; kolom < x + lebar - 8; kolom += 27) {\n          pena.fillRect(kolom, baris, 12, 15);\n        }\n      }\n    }\n\n    // Menggambar pasangan gedung di atas dan bawah celah.\n    function gambarGedung() {\n      gedung.forEach((item) => {\n        gambarSatuGedung(item.x, 0, LEBAR_GEDUNG, item.batasCelah);\n        const bawah = item.batasCelah + LEBAR_CELAH;\n        gambarSatuGedung(item.x, bawah, LEBAR_GEDUNG, TINGGI_KANVAS - TINGGI_TANAH - bawah);\n      });\n    }\n\n    // ===== BAGIAN 5: KONTROL (ketuk, klik, spasi) =====\n    // Menaikkan drone hanya ketika permainan aktif dan tidak dalam jeda aman.\n    function naikkanDrone() {\n      if (layarAktif !== \"main\" || performance.now() < waktuKebal) return;\n      drone.kecepatanY = KEKUATAN_LONCAT;\n      drone.kilau = 10;\n    }\n\n    kanvas.addEventListener(\"pointerdown\", (peristiwa) => {\n      if (layarAktif !== \"main\") return;\n      peristiwa.preventDefault();\n      naikkanDrone();\n      kanvas.focus({ preventScroll: true });\n    });\n    document.addEventListener(\"keydown\", (peristiwa) => {\n      if (peristiwa.code !== \"Space\" || layarAktif !== \"main\") return;\n      peristiwa.preventDefault();\n      if (peristiwa.repeat) return;\n      naikkanDrone();\n    });\n\n    // ===== BAGIAN 6: GAME LOOP (pergerakan tiap frame) =====\n    // Menggerakkan drone dan gedung, lalu menggambar satu frame permainan.\n    function putarPermainan(waktu) {\n      if (layarAktif !== \"main\") return;\n      const langkah = Math.min((waktu - waktuFrameTerakhir) / 16.67 || 1, 2);\n      waktuFrameTerakhir = waktu;\n      waktuPermainan += langkah;\n      const aman = waktu < waktuKebal;\n\n      if (!aman) {\n        drone.kecepatanY += GRAVITASI * langkah;\n        drone.y += drone.kecepatanY * langkah;\n        gedung.forEach((item) => { item.x -= kecepatanGedung * langkah; });\n        if (gedung[gedung.length - 1].x < LEBAR_KANVAS - JARAK_GEDUNG) {\n          gedung.push(buatGedung(LEBAR_KANVAS + 10));\n        }\n        gedung = gedung.filter((item) => item.x + LEBAR_GEDUNG > -10);\n        cekTabrakan(waktu);\n        if (layarAktif === \"main\" && waktu >= waktuKebal) periksaSkor();\n      }\n\n      if (drone.y < JARI_JARI_DRONE) {\n        drone.y = JARI_JARI_DRONE;\n        drone.kecepatanY = Math.max(0, drone.kecepatanY);\n      }\n      if (drone.kilau > 0) drone.kilau -= langkah;\n      gambarLatar();\n      gambarGedung();\n      gambarDrone();\n      if (waktu >= waktuPesan) pesanGame.hidden = true;\n      if (layarAktif === \"main\") nomorAnimasi = requestAnimationFrame(putarPermainan);\n    }\n\n    // ===== BAGIAN 7: TABRAKAN =====\n    // Memeriksa sentuhan drone dengan gedung atau tanah.\n    function cekTabrakan(waktu) {\n      const menabrakTanah = drone.y + JARI_JARI_DRONE >= TINGGI_KANVAS - TINGGI_TANAH;\n      const menabrakGedung = gedung.some((item) => {\n        const sejajar = drone.x + JARI_JARI_DRONE > item.x &&\n          drone.x - JARI_JARI_DRONE < item.x + LEBAR_GEDUNG;\n        return sejajar && (\n          drone.y - JARI_JARI_DRONE < item.batasCelah ||\n          drone.y + JARI_JARI_DRONE > item.batasCelah + LEBAR_CELAH\n        );\n      });\n      if (menabrakTanah || menabrakGedung) kurangiNyawa(waktu);\n    }\n\n    // ===== BAGIAN 8: SKOR DAN NYAWA =====\n    // Menampilkan pesan singkat sebagai umpan balik permainan.\n    function tampilkanPesan(teks, lama, waktu) {\n      pesanGame.textContent = teks;\n      pesanGame.hidden = false;\n      waktuPesan = waktu + lama;\n    }\n\n    // Memperbarui angka skor dan ikon hati di layar.\n    function perbaruiTampilan() {\n      const tampilanSkor = document.getElementById(\"tampilan-skor\");\n      const tampilanNyawa = document.getElementById(\"tampilan-nyawa\");\n      tampilanSkor.textContent = skor;\n      tampilanSkor.setAttribute(\"aria-label\", \"Skor \" + skor);\n      tampilanNyawa.textContent = \"❤️\".repeat(nyawa) + \"🤍\".repeat(JUMLAH_NYAWA - nyawa);\n      tampilanNyawa.setAttribute(\"aria-label\", nyawa + \" nyawa tersisa\");\n    }\n\n    // Memberi poin ketika drone sudah melewati satu celah.\n    function periksaSkor() {\n      gedung.forEach((item) => {\n        if (item.sudahDilewati || item.x + LEBAR_GEDUNG >= drone.x - JARI_JARI_DRONE) return;\n        item.sudahDilewati = true;\n        skor += 1;\n        drone.kilau = 18;\n        if (skor % 5 === 0) {\n          kecepatanGedung += TAMBAHAN_KECEPATAN;\n          tampilkanPesan(\"⭐ Skor \" + skor + \" • Gedung makin cepat!\", 1100, performance.now());\n        } else {\n          tampilkanPesan(\"+1 poin! ✨\", 650, performance.now());\n        }\n        perbaruiTampilan();\n        if (skor >= SKOR_MENANG) akhiriPermainan(true);\n      });\n    }\n\n    // Mengurangi satu nyawa dan memberi jeda aman setelah drone kembali ke tengah.\n    function kurangiNyawa(waktu) {\n      nyawa -= 1;\n      perbaruiTampilan();\n      if (nyawa <= 0) {\n        akhiriPermainan(false);\n        return;\n      }\n      aturUlangDrone();\n      waktuKebal = waktu + JEDA_KEBAL;\n      tampilkanPesan(\"💥 Tabrakan! Sisa \" + nyawa + \" nyawa\", JEDA_KEBAL, waktu);\n    }\n\n    // ===== BAGIAN 9: MENANG DAN KALAH =====\n    // Menghentikan permainan dan menampilkan hasil sesuai kondisi akhir.\n    function akhiriPermainan(berhasil) {\n      if (berhasil) {\n        document.getElementById(\"skor-menang\").textContent = \"Skor: \" + skor;\n        tampilkanLayar(\"menang\");\n      } else {\n        document.getElementById(\"skor-kalah\").textContent = \"Skor: \" + skor;\n        tampilkanLayar(\"kalah\");\n      }\n      if (nomorAnimasi !== null) cancelAnimationFrame(nomorAnimasi);\n      nomorAnimasi = null;\n    }\n\n    // ===== BAGIAN 10: MULAI ULANG =====\n    // Mengatur ulang semua keadaan permainan lalu memulai putaran baru.\n    function mulaiUlang() {\n      if (nomorAnimasi !== null) cancelAnimationFrame(nomorAnimasi);\n      nomorAnimasi = null;\n      skor = 0;\n      nyawa = JUMLAH_NYAWA;\n      kecepatanGedung = KECEPATAN_GEDUNG;\n      waktuKebal = 0;\n      waktuPesan = 0;\n      waktuPermainan = 0;\n      waktuFrameTerakhir = performance.now();\n      aturUlangDrone();\n      gedung = [buatGedung(LEBAR_KANVAS + 85)];\n      perbaruiTampilan();\n      tampilkanLayar(\"main\");\n      kanvas.focus({ preventScroll: true });\n      nomorAnimasi = requestAnimationFrame(putarPermainan);\n    }\n\n    document.getElementById(\"tombol-mulai\").addEventListener(\"click\", mulaiUlang);\n    document.getElementById(\"tombol-cara\").addEventListener(\"click\", () => tampilkanLayar(\"cara\"));\n    document.getElementById(\"tombol-kembali\").addEventListener(\"click\", () => tampilkanLayar(\"menu\"));\n    document.getElementById(\"tombol-main-lagi\").addEventListener(\"click\", mulaiUlang);\n    document.getElementById(\"tombol-coba-lagi\").addEventListener(\"click\", mulaiUlang);\n\n    aturUlangDrone();\n    gedung = [];\n    gambarLatar();\n    gambarDrone();\n  <\/script>\n <\/body>\n<\/html>\n";

return 'Buatkan game interaktif berbahasa Indonesia berjudul "'+j+'" untuk siswa SMA, bisa dimainkan di HP (sentuh layar) dan laptop (mouse atau keyboard). Tampilan responsif, digambar dengan bentuk sederhana pada canvas HTML.\n\nCERITA: '+g[3]+'\nKARAKTER: '+k+'\nRINTANGAN / OBJEK: '+o+'\n\nCARA BERMAIN: '+c.a+'\nKONTROL: '+c.k+'\n\nNYAWA, SKOR, MENANG, KALAH:\n- Pemain punya 3 nyawa (ikon hati).\n- Setelah kehilangan nyawa ada jeda 1 detik.\n- MENANG jika skor mencapai 15. KALAH jika nyawa habis.\n- Kesulitan naik sedikit setiap skor kelipatan 5.\n\nLAYAR: (1) Menu Utama dengan judul, tombol Mulai, dan tombol Cara Bermain; (2) Cara Bermain; (3) Layar Permainan dengan skor dan hati; (4) Layar Menang dengan skor dan tombol Main Lagi; (5) Layar Game Over dengan skor dan tombol Coba Lagi.\n\nATURAN PENULISAN KODE (PENTING, kode ini akan dipelajari siswa):\n1. Satu file saja, ditulis rapi.\n2. Bagi kode menjadi bagian-bagian berurutan dengan komentar judul persis seperti ini:\n'+lb+'\n3. Di BAGIAN 1 kumpulkan semua angka penting sebagai konstanta bernama jelas, misalnya JUMLAH_NYAWA, GRAVITASI, KECEPATAN, SKOR_MENANG.\n4. Beri komentar bahasa Indonesia singkat di setiap fungsi tentang tugasnya.\n5. Gunakan nama variabel dan fungsi berbahasa Indonesia yang mudah dipahami.\n6. Pastikan tidak ada error dan semua tombol berfungsi.'}

["Bab I Pendahuluan","Latar belakang, tujuan, dan manfaat.",["1.1 Latar belakang: kenapa memilih game ini dan apa peran AI","1.2 Tujuan: apa yang ingin dicapai","1.3 Manfaat: untuk siswa, pengguna game, dan sekolah"],
"<p><b>1.1 Latar Belakang</b><br>Perkembangan kecerdasan buatan (AI) membuat pembuatan media digital menjadi lebih mudah. Dengan perintah berupa teks (prompt), AI dapat menghasilkan gambar, tulisan, bahkan program. Pada ujian praktik ini, saya memanfaatkan AI di Canva Code untuk membuat game interaktif berjudul Drone Lolos Gedung. Game ini dipilih karena kontrolnya sederhana, yaitu cukup mengetuk layar, tetapi di dalamnya terdapat konsep penting pemrograman seperti variabel, percabangan, dan perulangan.</p><p><b>1.2 Tujuan</b><br>Tujuan pembuatan game ini adalah (1) membuat game yang berjalan tanpa error di Canva dan di HP, (2) memahami fungsi setiap bagian kode, dan (3) menyusun laporan yang sesuai dengan karya saya sendiri.</p><p><b>1.3 Manfaat</b><br>Bagi saya, kegiatan ini melatih kemampuan membaca kode dan menguji program. Bagi pemain, game ini menjadi hiburan sekaligus pengenalan cerita tentang kota pintar. Bagi sekolah, laporan ini menjadi bukti penerapan teknologi AI dalam pembelajaran Informatika.</p>"],
["Bab II Landasan Teori","Penjelasan teori yang dipakai.",["2.1 Canva dan Canva Code","2.2 AI generatif dan prompt","2.3 Logika pemrograman game: variabel, percabangan, perulangan, fungsi","2.4 Berpikir komputasional: dekomposisi, pengenalan pola, abstraksi, algoritma"],
"<p><b>2.1 Canva dan Canva Code</b><br>Canva adalah platform desain berbasis web. Canva Code adalah fitur yang dapat membuat program dari perintah teks sehingga pengguna dapat menghasilkan aplikasi atau game interaktif tanpa menulis semua kode dari awal.</p><p><b>2.2 AI Generatif dan Prompt</b><br>AI generatif adalah jenis kecerdasan buatan yang menghasilkan konten baru, misalnya teks, gambar, atau kode. Prompt adalah perintah yang kita tulis. Semakin jelas prompt, semakin sesuai hasil yang dibuat AI.</p><p><b>2.3 Logika Pemrograman Game</b><br>Variabel adalah tempat menyimpan data yang dapat berubah, misalnya skor dan nyawa. Percabangan adalah pemilihan tindakan berdasarkan kondisi, misalnya jika nyawa sama dengan 0 maka layar Game Over tampil. Perulangan adalah proses yang berjalan berulang-ulang; pada game ini, game loop dipanggil sekitar 60 kali per detik sehingga drone tampak bergerak. Fungsi adalah kumpulan perintah yang diberi nama agar dapat dipanggil kapan saja.</p><p><b>2.4 Berpikir Komputasional</b><br>Dekomposisi: game dipecah menjadi 10 bagian kode. Pengenalan pola: gedung muncul berulang dengan celah acak. Abstraksi: drone digambar dengan bentuk sederhana tanpa detail berlebihan. Algoritma: urutan langkah dari menekan Mulai sampai muncul layar Menang atau Game Over.</p>"],
["Bab III Perancangan","Rancangan game sebelum dibuat.",["3.1 Judul dan deskripsi singkat game","3.2 Target pengguna","3.3 Aturan: rintangan, nyawa atau skor, menang dan kalah","3.4 Peta alur layar (flowchart)","3.5 Daftar karakter dan latar"],
"<p><b>3.1 Deskripsi Game</b><br>Drone Lolos Gedung adalah game bergenre terbang melewati celah. Ceritanya, sebuah kota pintar diserang virus dan pemain mengendalikan drone yang mengantar penawar.</p><p><b>3.2 Target Pengguna</b><br>Game ini ditujukan untuk siswa SMA dan dapat dimainkan di HP maupun laptop.</p><p><b>3.3 Aturan Permainan</b><br>Pemain memiliki 3 nyawa. Drone naik setiap layar diketuk dan jatuh karena gravitasi. Skor bertambah 1 setiap drone lolos satu celah gedung. Menabrak gedung atau tanah mengurangi 1 nyawa. Pemain menang jika skor mencapai 15 dan kalah jika nyawa habis. Kecepatan gedung naik setiap skor kelipatan 5.</p><p><b>3.4 Alur Layar</b><br>Menu Utama, lalu klik Mulai Misi menuju Permainan. Dari Permainan, hasilnya adalah layar Menang atau layar Game Over. Dari kedua layar itu, klik Main Lagi atau Coba Lagi untuk kembali ke Permainan. (Gambarkan sebagai flowchart.)</p><p><b>3.5 Karakter dan Latar</b><br>Karakter: drone oranye. Rintangan: gedung abu-abu dengan celah acak. Latar: langit biru, awan, dan tanah.</p>"],
["Bab IV Proses Pembuatan","Langkah pembuatan, prompt, KODE LENGKAP game, dan BEDAH KODE 10 bagian.",["4.1 Langkah pengerjaan disertai tangkapan layar","4.2 Prompt yang dipakai (tulis utuh)","4.3 KODE LENGKAP GAME: tempel seluruh kode dari Canva Code di sini","4.4 BEDAH KODE: tabel 10 bagian (bagian, fungsi, yang terlihat, cara kerja)","4.5 Percobaan mengubah angka dan hasilnya","4.6 Kendala dan cara mengatasinya"],
"<p><b>4.1 Langkah Pengerjaan</b><br>Pertama, saya membuka Canva dan memilih Kode. Kedua, saya menempelkan prompt lalu menunggu game selesai dibuat. Ketiga, saya memainkan game di Canva dan di HP untuk memeriksa tampilan dan kontrol. Keempat, saya menyalin seluruh kode untuk dipelajari. (Sertakan tangkapan layar di setiap langkah.)</p><p><b>4.2 Prompt yang Dipakai</b><br>Tulis prompt secara utuh, tanpa dipotong, lalu sebutkan jika ada perubahan prompt setelah pengujian.</p><p><b>4.3 Kode Lengkap Game</b><br>Seluruh kode hasil Canva Code ditempel utuh di subbab ini, tanpa diubah dan tanpa dipotong. Gunakan huruf Courier New 10 pt dengan spasi 1 agar mudah dibaca. Kalau terlalu panjang, boleh dicetak dengan dua kolom atau diberi nomor baris.</p><p><b>4.4 Bedah Kode</b><br>Kode dari 4.3 dipilah menjadi 10 bagian. Contoh satu baris tabel:</p><div class=\"tbl\"><table><tr><th>Bagian</th><th>Fungsi</th><th>Yang terlihat</th><th>Cara kerja</th></tr><tr><td>7 Tabrakan</td><td>cekTabrakan()</td><td>Drone kehilangan nyawa saat menyentuh gedung atau tanah</td><td>Membandingkan posisi drone dengan gedung lalu memanggil kurangiNyawa()</td></tr></table></div><p>Setiap bagian dijelaskan dengan kalimat sendiri; tidak cukup hanya satu baris di tabel. Beri juga potongan kode bagian itu dan jelaskan baris pentingnya.</p><p><b>4.5 Percobaan Mengubah Angka</b><br>Saya mengubah JUMLAH_NYAWA dari 3 menjadi 5. Hasilnya, hati di layar menjadi 5, sehingga terbukti konstanta itu mengatur jumlah nyawa.</p><p><b>4.6 Kendala</b><br>Pada percobaan pertama, tombol Mulai tidak merespons di HP. Saya meminta Canva Code memperbaikinya dan setelah itu tombol berfungsi.</p>"],
["Bab V Pengujian","Bukti bahwa game berjalan benar.",["5.1 Tabel pengujian: fungsi, skenario, hasil diharapkan, hasil, status, bagian kode","5.2 Pengujian di HP","5.3 Error yang ditemukan dan perbaikannya","5.4 Pembahasan hasil pengujian"],
